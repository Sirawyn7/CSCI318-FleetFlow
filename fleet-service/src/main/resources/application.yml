server:
  port: 8082

spring:
  application:
    name: fleet-service
  datasource:
    url: jdbc:h2:file:./data/fleetdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
  cloud:
    function:
            consumer:
              enableDlq: true
          orderReassignedConsumer-in-0:
