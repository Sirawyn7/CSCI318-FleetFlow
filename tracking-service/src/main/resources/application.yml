server:
  port: 8084

spring:
  application:
    name: tracking-service
  datasource:
    url: jdbc:h2:file:./data/trackingdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
  cloud:
    function:
      # Combines this service's plain-binder consumers (bootstrap projections) with
      # the kafka-streams-binder function (FR11's topology) in one definition --
      # Spring Cloud Stream routes each to the correct binder automatically based on
      # its KStream/KTable vs plain-type parameters.
      definition: orderPlacedConsumer;courierRegisteredConsumer;orderAssignedConsumer;etaRecalculation
    stream:
      bindings:
        # --- Regular binder: bootstrap consumers ---
        orderPlacedConsumer-in-0:
          destination: fleetflow.order.order-placed
          group: tracking-service
        courierRegisteredConsumer-in-0:
          destination: fleetflow.fleet.courier-registered
          group: tracking-service
        orderAssignedConsumer-in-0:
          destination: fleetflow.dispatch.order-assigned
          group: tracking-service
        # --- Regular binder: bootstrap publishers ---
        deliveryStarted-out-0:
          destination: fleetflow.tracking.delivery-started
        activeDeliverySnapshot-out-0:
          # Internal materialization topic (see ActiveDeliverySnapshot's Javadoc) --
          # deliberately named outside the fleetflow.<context>.<event> catalogue
          # convention, to signal this is not a domain event any other service should
          # ever consume.
          destination: fleetflow.tracking.internal.active-delivery-by-courier
          producer:
            configuration:
              key.serializer: org.apache.kafka.common.serialization.StringSerializer
        # --- kafka-streams binder: FR11 topology ---
        # in-0 = KStream<String, CourierLocationUpdated>, in-1 = KTable<String,
        # ActiveDeliverySnapshot>, out-0 = KStream<String, DeliveryEtaUpdated>.
        etaRecalculation-in-0:
          destination: fleetflow.fleet.courier-location-updated
        etaRecalculation-in-1:
          destination: fleetflow.tracking.internal.active-delivery-by-courier
        etaRecalculation-out-0:
          destination: fleetflow.tracking.delivery-eta-updated
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
        streams:
          binder:
            brokers: ${KAFKA_BROKERS:localhost:9092}
            # Stable across restarts -- Kafka Streams uses this as the consumer group
            # id and to name local RocksDB state-store directories for recovery.
            application-id: tracking-service-eta-recalculation
            configuration:
              default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde