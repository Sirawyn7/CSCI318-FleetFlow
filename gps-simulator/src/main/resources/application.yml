# The simulator is an external REST client, not a Spring Boot service: it posts
# location pings to Fleet's REST endpoint and serves nothing of its own, so it
# runs with no embedded web server.
spring:
  main:
    web-application-type: none
  application:
    name: gps-simulator


# FR10 config: courier-id must be a UUID already registered via
# POST /api/couriers on fleet-service (see FR4) -- the simulator doesn't register a
# courier itself, it only reports location for one that already exists. Replace the
# placeholder below with a real registered courier's ID before running.
simulator:
  fleet-base-url: http://localhost:8082
  courier-id: 00000000-0000-0000-0000-000000000000
  ping-interval-ms: 5000