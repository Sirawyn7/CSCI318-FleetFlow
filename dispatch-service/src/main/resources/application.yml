server:
  port: 8083

spring:
  application:
    name: dispatch-service
  datasource:
    url: jdbc:h2:file:./data/dispatchdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
  cloud:
    function:
      # Registers the functional consumer bean(s) below with Spring Cloud Stream.
      definition: courierRegisteredConsumer
    stream:
      # Binding name convention: <functionBeanName>-in-0. Consumer group = service name,
      # so every dispatch-service instance shares one logical subscription rather than
      # each receiving its own copy of every event.
      bindings:
        courierRegisteredConsumer-in-0:
          destination: fleetflow.fleet.courier-registered
          group: dispatch-service
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
